{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="narrow">
  <div class="panel">
    <div class="panel-body">
      <h1 class="h4">{{ title }}</h1>
      <p class="text-muted">{{ message|default:"This cannot be undone." }}</p>
      <form method="post" class="form-actions">
        {% csrf_token %}
        <button class="btn btn-danger">Yes, continue</button>
        <a class="btn btn-link" href="{% if cancel_arg %}{% url cancel_url cancel_arg %}{% else %}{% url cancel_url %}{% endif %}">Cancel</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
