{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="narrow">
  <div class="page-head">
    <div>
      <h1>{{ title }}</h1>
      {% if subtitle %}<p class="sub">{{ subtitle }}</p>{% endif %}
    </div>
  </div>

  <div class="panel">
    <div class="panel-body">
      <form method="post" {% if multipart %}enctype="multipart/form-data"{% endif %}>
        {% csrf_token %}
        {% include "partials/form_fields.html" %}
        <div class="form-actions">
          <button class="btn btn-primary">{{ submit_label|default:"Save" }}</button>
          <a class="btn btn-link" href="{% if cancel_arg %}{% url cancel_url cancel_arg %}{% else %}{% url cancel_url %}{% endif %}">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
